services:
  # 1. Trạm Trung Chuyển (Message Broker)
  - type: redis
    name: voting-redis
    ipAllowList: []
    plan: free
    maxmemoryPolicy: noeviction

  # 2. Dịch vụ Web Chính (Django)
  - type: web
    name: voting-dapp-web
    env: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "bash ./start.sh"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: REDIS_URL
        fromService:
          type: redis
          name: voting-redis
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: USE_SQLITE
        value: "False"
      - key: DATABASE_URL
        sync: false # Nhập tay từ Supabase trên Dashboard
      - key: ALCHEMY_RPC_URL
        sync: false
      - key: PRIVATE_KEY
        sync: false


